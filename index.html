<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atomix OPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1f7a4f;
      --green-dark: #005f47;
      --green-soft: #e8f7ee;
      --green-pale: #f2fbf5;
      --blue: #4f8cff;
      --blue-soft: #eef5ff;
      --teal-soft: #e9fbfa;
      --teal: #008f84;
      --amber-soft: #fff4de;
      --amber: #b76e00;
      --ink: #0b1f33;
      --text: #445568;
      --muted: #8a94a3;
      --line: #e5e7eb;
      --line-dark: #d1d5db;
      --bg: #f5f5f5;
      --panel: #ffffff;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.10);
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, Arial, sans-serif; color: var(--ink); background: var(--bg); }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 128px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; background: #fff; border-right: 1px solid var(--line); padding: 17px 12px; display: flex; flex-direction: column; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 7px; color: var(--green-dark); font-family: 'IBM Plex Sans', Inter, Arial, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -0.2px; }
    .brand-mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--green); display: grid; place-items: center; color: var(--green); font-size: 14px; line-height: 1; }
    .brand-chevron { margin-left: auto; color: var(--green-dark); font-size: 16px; }
    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-item { width: 100%; border: 0; background: transparent; color: #172033; display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 7px; font-size: 12px; font-weight: 500; text-align: left; cursor: pointer; }
    .nav-item:hover { background: var(--green-pale); color: var(--green-dark); }
    .nav-item.active { background: var(--green); color: #fff; font-weight: 700; }
    .nav-icon { width: 13px; text-align: center; opacity: .9; }
    .main { min-width: 0; }
    .topbar { height: 52px; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 2px 7px rgba(0,0,0,.16); display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 34px; }
    .page-title { font-size: 15px; font-weight: 500; color: #05080d; }
    .top-actions { display: flex; align-items: center; gap: 20px; }
    .bell { position: relative; font-size: 18px; color: #05080d; }
    .bell-badge { position: absolute; top: -7px; right: -9px; min-width: 14px; height: 14px; border-radius: 999px; background: var(--green); color: #fff; font-size: 9px; display: grid; place-items: center; font-weight: 700; }
    .user { display: flex; align-items: center; gap: 9px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e5e5e5; display: grid; place-items: center; color: #111; font-weight: 700; }
    .user-name { font-size: 12px; font-weight: 800; color: #05080d; }
    .user-role { font-size: 11px; color: #05080d; margin-top: 1px; }
    .content { padding: 16px 10px 34px 12px; }
    .stats-row { height: 108px; display: flex; align-items: flex-start; justify-content: center; gap: 16px; padding-top: 0; }
    .stat-card { width: 242px; min-height: 56px; background: #fff; border: 1px solid #9aa5b5; border-radius: 7px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .stat-card.green { border-color: var(--green); color: var(--green-dark); }
    .stat-card.blue { border-color: var(--blue); color: var(--blue); }
    .stat-icon { font-size: 19px; color: currentColor; opacity: .9; }
    .stat-label { color: currentColor; opacity: .72; font-size: 14px; font-weight: 800; line-height: 1.1; }
    .stat-value { color: currentColor; font-size: 15px; font-weight: 800; line-height: 1.1; margin-top: 1px; }
    .toolbar { background: #fff; border-radius: 7px 7px 0 0; padding: 8px 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .filters { display: flex; align-items: center; gap: 14px; }
    .search, .select { height: 32px; border: 1px solid #9fa5af; border-radius: 7px; background: #fff; color: #344054; font-size: 12px; padding: 0 12px; outline: none; }
    .search { width: 228px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .select { min-width: 116px; }
    .toolbar-actions { display: flex; align-items: center; gap: 10px; }
    .primary-btn { height: 33px; background: var(--green); border: 1px solid var(--green); border-radius: 7px; color: #fff; padding: 0 16px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .primary-btn:hover { background: var(--green-dark); border-color: var(--green-dark); }
    .refresh-btn { width: 33px; height: 33px; border: 1px solid var(--green); color: var(--green-dark); background: #fff; border-radius: 7px; cursor: pointer; font-size: 16px; }
    .table-card { background: #fff; border-radius: 0 0 10px 10px; box-shadow: var(--shadow); overflow: hidden; min-height: calc(100vh - 236px); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border-bottom: 1px solid #dedede; padding: 11px 12px; text-align: left; vertical-align: middle; }
    th { font-size: 12px; color: #07152a; font-weight: 700; background: #fff; }
    td { font-size: 12px; color: #455466; height: 45px; }
    .open-cell { width: 54px; text-align: center; color: var(--ink); font-size: 24px; line-height: 1; }
    .row { cursor: pointer; }
    .row:hover { background: #fbfbfb; }
    .module-name { color: #344054; font-weight: 600; }
    .category { color: #4d5c6f; }
    .pill { display: inline-flex; align-items: center; justify-content: center; min-width: 70px; border-radius: 4px; padding: 5px 8px; font-size: 11px; font-weight: 500; }
    .pill-active { color: var(--green); background: #e7f6eb; }
    .pill-core { color: var(--green-dark); background: #e7f6eb; }
    .pill-labor { color: #008b85; background: #e5f7f7; }
    .pill-system { color: var(--blue); background: var(--blue-soft); }
    .pill-risk { color: var(--amber); background: var(--amber-soft); }
    .progress-wrap { width: 150px; height: 12px; border-radius: 999px; background: #e9f4ee; border: 1px solid #cfd8d4; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; background: #2ecc71; border-radius: inherit; }
    .progress-text { position: absolute; inset: 0; display: grid; place-items: center; color: #07152a; font-size: 10px; font-weight: 700; }
    .footer-row { display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 18px 26px; color: #172033; font-size: 12px; background: #fff; }
    .page-size { border: 1px solid #9fa5af; background: #fff; border-radius: 7px; padding: 7px 12px; font-size: 12px; }
    .chat-orb { position: fixed; right: 18px; bottom: 18px; width: 49px; height: 49px; border-radius: 50%; background: #09223a; display: grid; place-items: center; color: #fff; box-shadow: 0 2px 7px rgba(0,0,0,.22); font-size: 22px; }
    @media (max-width: 980px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; }
      .brand { min-width: 110px; }
      .nav { flex-direction: row; }
      .nav-item { white-space: nowrap; }
      .stats-row { height: auto; padding: 12px 0; flex-wrap: wrap; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .filters { flex-wrap: wrap; gap: 8px; }
      .search { width: 100%; border-radius: 7px; }
      table { min-width: 980px; }
      .table-card { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">⬡</span><span>atomix</span><span class="brand-chevron">‹</span></div>
      <nav class="nav" aria-label="Atomix OPS modules">
        <button class="nav-item" onclick="window.location.href='./shiftflow.html'"><span class="nav-icon">⌂</span>EOD</button>
        <button class="nav-item" onclick="window.location.href='./atomix-inventory-dashboard.html'"><span class="nav-icon">↯</span>Inventory</button>
        <button class="nav-item" onclick="window.location.href='./atomix-labor-clock.html'"><span class="nav-icon">◴</span>Labor Clock</button>
        <button class="nav-item" onclick="window.location.href='./workforce-scheduler-main/workforce-scheduler-main/index.html'"><span class="nav-icon">◫</span>Scheduling</button>
        <button class="nav-item active" onclick="window.location.href='./index.html'"><span class="nav-icon">▣</span>Ops Home</button>
        <button class="nav-item" onclick="window.location.href='./atomix-analytics.html'"><span class="nav-icon">▥</span>Reports</button>
        <button class="nav-item" onclick="window.location.href='https://drake-arch.github.io/atx-corrective-action/'"><span class="nav-icon">⚠</span>Corrective</button>
        <button class="nav-item" onclick="window.location.href='./firefighter.html'"><span class="nav-icon">✦</span>Firefighter</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-title">Atomix OPS</div>
        <div class="top-actions">
          <div class="bell">♧<span class="bell-badge">8</span></div>
          <div class="user">
            <div class="avatar">⌾</div>
            <div><div class="user-name">Drake Meyer</div><div class="user-role">Admin</div></div>
          </div>
        </div>
      </header>

      <section class="content">
        <div class="stats-row" aria-label="Ops module summary">
          <div class="stat-card"><div class="stat-icon">◇</div><div><div class="stat-label">Total Modules ⓘ</div><div class="stat-value">27</div></div></div>
          <div class="stat-card green"><div class="stat-icon">▣</div><div><div class="stat-label">Priority Modules ⓘ</div><div class="stat-value">7</div></div></div>
          <div class="stat-card blue"><div class="stat-icon">◉</div><div><div class="stat-label">Linked Tools ⓘ</div><div class="stat-value">27</div></div></div>
        </div>

        <div class="toolbar">
          <div class="filters">
            <input class="search" id="searchInput" type="search" placeholder="Search" oninput="filterRows()" />
            <select class="select" id="statusFilter" onchange="filterRows()">
              <option value="All">All</option>
              <option value="Active">Active</option>
              <option value="Core">Core</option>
              <option value="Labor">Labor</option>
              <option value="System">System</option>
              <option value="Risk">Risk</option>
            </select>
            <select class="select" id="categoryFilter" onchange="filterRows()">
              <option value="All">All Areas</option>
              <option value="Closeout">Closeout</option>
              <option value="Labor">Labor</option>
              <option value="Inventory">Inventory</option>
              <option value="Quality">Quality</option>
              <option value="Finance">Finance</option>
              <option value="Tools">Tools</option>
            </select>
            <select class="select" id="priorityFilter" onchange="filterRows()">
              <option value="All">Priority</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Utility">Utility</option>
            </select>
          </div>
          <div class="toolbar-actions">
            <button class="primary-btn" onclick="window.location.href='./shiftflow.html'">＋ Open EOD Reporting</button>
            <button class="refresh-btn" onclick="window.location.reload()" title="Refresh">↻</button>
          </div>
        </div>

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th style="width:54px"></th>
                <th>Module</th>
                <th>Owner Area</th>
                <th>Category</th>
                <th>Module Status</th>
                <th>Priority</th>
                <th>Readiness</th>
                <th>Route</th>
              </tr>
            </thead>
            <tbody id="moduleRows"></tbody>
          </table>
          <div class="footer-row">
            <span>Items per page:</span><select class="page-size"><option>25</option></select><span id="rangeText">1 - 25 of 27</span><span>‹</span><span>›</span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div class="chat-orb">⬡</div>

  <script>
    const modules = [
      {name:'EOD Reporting', route:"./shiftflow.html", area:'Daily Closeout', category:'Closeout', status:'Active', priority:'High', readiness:100, desc:'ShiftFlow — daily submissions, labor data, and executive recap emails. Start here at closeout.'},
      {name:'Role Architect', route:"./role-architect.html", area:'Ownership', category:'Tools', status:'Core', priority:'High', readiness:94, desc:"Build org charts, assign RACI ownership, and map your team's responsibilities."},
      {name:'Labor Clock', route:"./atomix-labor-clock.html", area:'Floor Labor', category:'Labor', status:'Labor', priority:'High', readiness:96, desc:'Live floor view — assign, track, break zones.'},
      {name:'Scheduling', route:"./workforce-scheduler-main/workforce-scheduler-main/index.html", area:'Coverage', category:'Labor', status:'Core', priority:'High', readiness:92, desc:'Plans, coverage, and staffing alignment.'},
      {name:'Labor Analytics', route:"./atomix-analytics.html", area:'Labor Intel', category:'Labor', status:'Labor', priority:'High', readiness:95, desc:'Hours, costs, UPH, CPO, and productivity trends.'},
      {name:'Corrective Action', route:"https://drake-arch.github.io/atx-corrective-action/", area:'Accountability', category:'Quality', status:'Risk', priority:'High', readiness:90, desc:'Submit and track corrective actions linked to errors.'},
      {name:'Labor Projection', route:"./labor-projection.html", area:'Planning', category:'Labor', status:'Labor', priority:'High', readiness:91, desc:'OPH dial, staffing plans, CPO, and department breakdown.'},
      {name:'Pack Performance', route:"./packer-performance.html", area:'Outbound', category:'Labor', status:'Active', priority:'Medium', readiness:88, desc:'Packer scores adjusted to customer goal mix — not raw volume.'},
      {name:'Quality', route:"./quality/index.html", area:'QA', category:'Quality', status:'Active', priority:'Medium', readiness:82, desc:'Audits, defects, root cause, and follow-ups.'},
      {name:'Cycle Count', route:"./Cycelcount-main/index.html", area:'Inventory', category:'Inventory', status:'Active', priority:'Medium', readiness:86, desc:'Inventory accuracy, counts, and adjustments.'},
      {name:'Location Verification', route:"./location-verification.html", area:'Inventory', category:'Inventory', status:'Active', priority:'Medium', readiness:86, desc:'Verify locations, scan UPCs, and count inventory.'},
      {name:'Audit', route:"./audit-main/audit-main/index.html", area:'Compliance', category:'Quality', status:'Active', priority:'Medium', readiness:84, desc:'Policy compliance, daily checks, and evidence tracking.'},
      {name:'Error Tracking', route:"./error-tracking.html", area:'Defects', category:'Quality', status:'Risk', priority:'Medium', readiness:83, desc:'Log EBIN and PBIN errors with details.'},
      {name:'Error Trends', route:"https://drake-arch.github.io/atx-corrective-action/trend-analysis.html", area:'Defects', category:'Quality', status:'Risk', priority:'Medium', readiness:83, desc:'Weekly error rate vs. order volume trend analysis.'},
      {name:'Freight Audit', route:"./freight-audit.html", area:'Shipping', category:'Finance', status:'Active', priority:'Medium', readiness:80, desc:'Freight shipped, markups, and carrier billing.'},
      {name:'Carrier Pickup', route:"./carrier-pickup.html", area:'Shipping', category:'Tools', status:'Active', priority:'Medium', readiness:80, desc:'Track carrier pickups, manifests, and confirmations.'},
      {name:'Kitting Projections', route:"./kitting-projections.html", area:'Special Projects', category:'Labor', status:'Labor', priority:'Medium', readiness:78, desc:'Project kit completions, capacity, and output tracking.'},
      {name:'Labor Metrics', route:"./labor-metrics.html", area:'Labor Intel', category:'Labor', status:'Labor', priority:'Medium', readiness:85, desc:'Daily CPO, labor %, cost tracking, and weekly gap analysis.'},
      {name:'Inventory Dashboard', route:"./atomix-inventory-dashboard.html", area:'Inventory', category:'Inventory', status:'Core', priority:'Medium', readiness:89, desc:'Live IMS accuracy, capacity, and fast-pick alerts.'},
      {name:'Priority Roadmap', route:"https://drake-arch.github.io/atomix-ops/priority-roadmap.html", area:'Planning', category:'Tools', status:'System', priority:'Utility', readiness:75, desc:'Rate, prioritize, and track ops initiatives across all departments.'},
      {name:'Damage Control', route:"./damage-control.html", area:'Claims', category:'Quality', status:'Risk', priority:'Medium', readiness:78, desc:'Scan QR, capture photo, log damage — syncs to Google Sheets instantly.'},
      {name:'Billing Capture', route:"./billing.html", area:'Billing', category:'Finance', status:'Active', priority:'Medium', readiness:76, desc:'Non-compliant inbounds, expedited work, client purchases, and special projects.'},
      {name:'Ship Decision', route:"./ship-decision.html", area:'Shipping', category:'Tools', status:'System', priority:'Utility', readiness:74, desc:'Parcel or freight — instant B2B routing by customer weight threshold.'},
      {name:'Order Routing', route:"./order-routing.html", area:'Shipping', category:'Tools', status:'System', priority:'Utility', readiness:74, desc:'Flag mis-routed orders — analyze live CSV data to catch parcel vs. LTL errors.'},
      {name:'SOP Trainer', route:"./sop-trainer.html", area:'Training', category:'Tools', status:'System', priority:'Utility', readiness:72, desc:'Upload any SOP — generate quick ref cards, work instructions, new hire guides, and quizzes instantly.'},
      {name:'Metrics', route:null, area:'Dashboards', category:'Tools', status:'System', priority:'Utility', readiness:50, desc:'Dashboards, KPIs, and operational visibility.'},
      {name:'🔥 Firefighter', route:"./firefighter.html", area:'Issues', category:'Tools', status:'Risk', priority:'Medium', readiness:80, desc:'Add issues, pull Slack + Gmail, or run a weekly recap.'}
    ];

    function statusClass(status) {
      return status === 'Labor' ? 'pill-labor' : status === 'System' ? 'pill-system' : status === 'Risk' ? 'pill-risk' : status === 'Core' ? 'pill-core' : 'pill-active';
    }
    function openModule(route) {
      if (route) window.location.href = route;
      else alert('Metrics module coming soon!');
    }
    function renderRows(rows) {
      const tbody = document.getElementById('moduleRows');
      tbody.innerHTML = rows.map((m, idx) => `
        <tr class="row" onclick="openModule(${JSON.stringify(m.route)})">
          <td class="open-cell">›</td>
          <td><div class="module-name">${m.name}</div><div style="font-size:11px;color:var(--muted);margin-top:3px">${m.desc}</div></td>
          <td>${m.area}</td>
          <td class="category">${m.category}</td>
          <td><span class="pill ${statusClass(m.status)}">${m.status}</span></td>
          <td><span class="pill pill-labor">${m.priority}</span></td>
          <td><div class="progress-wrap"><div class="progress-fill" style="width:${m.readiness}%"></div><div class="progress-text">${m.readiness}%</div></div></td>
          <td>${m.route ? m.route.replace('./','') : 'coming soon'}</td>
        </tr>`).join('');
      document.getElementById('rangeText').textContent = rows.length ? `1 - ${Math.min(rows.length, 25)} of ${modules.length}` : `0 of ${modules.length}`;
    }
    function filterRows() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const status = document.getElementById('statusFilter').value;
      const category = document.getElementById('categoryFilter').value;
      const priority = document.getElementById('priorityFilter').value;
      const rows = modules.filter(m => {
        const text = `${m.name} ${m.area} ${m.category} ${m.desc}`.toLowerCase();
        return (!q || text.includes(q)) && (status === 'All' || m.status === status) && (category === 'All' || m.category === category) && (priority === 'All' || m.priority === priority);
      });
      renderRows(rows);
    }
    renderRows(modules);
  </script>
</body>
</html>

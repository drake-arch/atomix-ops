<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomix EOD Reporting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .gradient-bg {
      background: linear-gradient(-45deg, #0D2D53, #1a4d7a, #0D2D53, #164a6e);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
    }
    .floating { animation: float 6s ease-in-out infinite; }
    .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
    .scale-in { animation: scaleIn 0.5s ease-out forwards; }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glow { box-shadow: 0 0 30px rgba(163, 243, 197, 0.3); }
    .input-focus:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(163, 243, 197, 0.3);
      border-color: #A3F3C5;
    }
    .grid-bg {
      background-image:
        linear-gradient(rgba(163, 243, 197, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(163, 243, 197, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .ops-expand {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .ops-expand.open {
      max-height: 200px;
    }
  </style>
</head>
<body class="bg-[#101314] text-[#EDEFED] overflow-x-hidden">
  <div id="app"></div>

  <script>
    const QUESTION_SETS = {
      'Outbound 1st': [
        { key: 'headcount', label: 'Headcount', type: 'number', required: true },
        { key: 'callins_count', label: 'How many call-ins?', type: 'number', required: true },
        { key: 'callins_who', label: 'Who called in?', type: 'text', required: false },
        { key: 'issues', label: 'What issues do we have?', type: 'textarea', required: false },
        { key: 'wins', label: 'What wins did we have?', type: 'textarea', required: false },
        { key: 'orders_shipped', label: 'How many orders did we ship?', type: 'number', required: true },
        { key: 'out_of_sla', label: 'Anything out of SLA?', type: 'yesno', required: true },
        { key: 'out_of_sla_details', label: 'SLA Details', type: 'textarea', required: false, showIf: { key: 'out_of_sla', value: 'yes' } }
      ],
      'Outbound 2nd': [
        { key: 'headcount', label: 'Headcount', type: 'number', required: true },
        { key: 'callins_count', label: 'How many call-ins?', type: 'number', required: true },
        { key: 'callins_who', label: 'Who called in?', type: 'text', required: false },
        { key: 'issues', label: 'What issues do we have?', type: 'textarea', required: false },
        { key: 'wins', label: 'What wins did we have?', type: 'textarea', required: false },
        { key: 'orders_shipped', label: 'How many orders did we ship?', type: 'number', required: true },
        { key: 'out_of_sla', label: 'Anything out of SLA?', type: 'yesno', required: true },
        { key: 'out_of_sla_details', label: 'SLA Details', type: 'textarea', required: false, showIf: { key: 'out_of_sla', value: 'yes' } },
        { key: 'all_carriers_picked_up', label: 'Did all carriers pick up?', type: 'yesno', required: true },
        { key: 'carrier_details', label: 'Carrier Details', type: 'textarea', required: false, showIf: { key: 'all_carriers_picked_up', value: 'no' } }
      ],
      'Inventory': [
        { key: 'headcount', label: 'Headcount', type: 'number', required: true },
        { key: 'callins_count', label: 'How many call-ins?', type: 'number', required: true },
        { key: 'callins_who', label: 'Who called in?', type: 'text', required: false },
        { key: 'issues', label: 'What issues do we have?', type: 'textarea', required: false },
        { key: 'wins', label: 'What wins did we have?', type: 'textarea', required: false }
      ],
      'Inbound': [
        { key: 'headcount', label: 'Headcount', type: 'number', required: true },
        { key: 'callins_count', label: 'How many call-ins?', type: 'number', required: true },
        { key: 'callins_who', label: 'Who called in?', type: 'text', required: false },
        { key: 'issues', label: 'What issues do we have?', type: 'textarea', required: false },
        { key: 'wins', label: 'What wins did we have?', type: 'textarea', required: false },
        { key: 'inbounds_today', label: 'How many inbounds today?', type: 'number', required: true },
        { key: 'out_of_sla', label: 'Anything out of SLA?', type: 'yesno', required: true },
        { key: 'out_of_sla_details', label: 'SLA Details', type: 'textarea', required: false, showIf: { key: 'out_of_sla', value: 'yes' } },
        { key: 'returns_today', label: 'How many returns today?', type: 'number', required: true }
      ],
      'Special Projects': [
        { key: 'headcount', label: 'Headcount', type: 'number', required: true },
        { key: 'callins_count', label: 'How many call-ins?', type: 'number', required: true },
        { key: 'callins_who', label: 'Who called in?', type: 'text', required: false },
        { key: 'issues', label: 'What issues do we have?', type: 'textarea', required: false },
        { key: 'wins', label: 'What wins did we have?', type: 'textarea', required: false },
        { key: 'projects_completed', label: 'How many projects completed?', type: 'number', required: true },
        { key: 'b2b_retail_orders_shipped', label: 'How many B2B/Retail orders shipped?', type: 'number', required: true },
        { key: 'kits_completed', label: 'How many kits complete?', type: 'number', required: true },
        { key: 'errors_reported', label: 'How many errors reported?', type: 'number', required: true }
      ],
      'Dedicated Inventory': [
        { key: 'wins', label: 'What wins did we have?', type: 'textarea', required: false },
        { key: 'pallets_moved', label: 'How many pallets were moved today?', type: 'number', required: true },
        { key: 'skus_counted', label: 'How many SKUs were counted today?', type: 'number', required: true },
        { key: 'dedicated_issues', label: 'Any issues?', type: 'textarea', required: false }
      ]
    };

    const DAILY_CUSTOM_QUESTION_SETS = {
      "Today Custom EOD — Kody": [
        { key: 'custom_q1', label: "Are we for sure gonna have the full back room completely cleared by Friday? If there's any blockers let me know.", type: 'textarea', required: true },
        { key: 'custom_q2', label: 'Are we caught up on corrective actions for reported errors?', type: 'textarea', required: true },
        { key: 'custom_q3', label: 'Vegas nights or Carolina hurricanes?', type: 'textarea', required: true }
      ],
      "Today Custom EOD — Luis": [
        { key: 'custom_q1', label: "Are we using the labor clock properly and putting everybody into the bubbles and moving them as they move around the building so we can track exactly what everyone\'s doing in inventory?", type: 'textarea', required: true },
        { key: 'custom_q2', label: 'What are the current PsychoCom projects you are working on?', type: 'textarea', required: true },
        { key: 'custom_q3', label: 'Are we on track to have lights fully off-boarded? Any blockers?', type: 'textarea', required: true },
        { key: 'custom_q4', label: 'Street Fighter or Mortal Kombat?', type: 'textarea', required: true }
      ],
      "Today Custom EOD — Hugh": [
        { key: 'custom_q1', label: 'Roughly what percentage of the back room did you guys end up moving tonight?', type: 'textarea', required: true },
        { key: 'custom_q2', label: 'When is your first day on first shift?', type: 'textarea', required: true },
        { key: 'custom_q3', label: 'Are we using the end-of-day audit list for a packing audit?', type: 'textarea', required: true },
        { key: 'custom_q4', label: "Unlimited Taco Bell or unlimited Hardee's?", type: 'textarea', required: true }
      ],
      "Today Custom EOD — Norman": [
        { key: 'custom_q1', label: "We need to do an audit on Scruffy Dog Boxes and prove that we\'re not doing anything wrong. Can you make sure we get that done by the end of the week?", type: 'textarea', required: true },
        { key: 'custom_q2', label: 'Where are you going to put the other camera?', type: 'textarea', required: true },
        { key: 'custom_q3', label: "What\'s the holdup on Rebo? I can push as needed. Let\'s get those suckers up.", type: 'textarea', required: true },
        { key: 'custom_q4', label: 'Let’s build out an ops process audit plan. I think you guys would be perfect for auditing all of our processes.', type: 'textarea', required: true },
        { key: 'custom_q5', label: 'Do you need me to go on Amazon and buy you a webcam?', type: 'textarea', required: true },
        { key: 'custom_q6', label: "Is there other ways to move inventory besides moving it? Yes — that button right there screws us up every time. You\'ve got to kill it. Options/context mentioned: lift the truck, or sports car.", type: 'textarea', required: true }
      ],
      "Today Custom EOD — Burke": [
        { key: 'custom_q1', label: 'What time do you peel off for the day? What time do I have to have these questions to you?', type: 'textarea', required: true },
        { key: 'custom_q2', label: "What\'s the coolest part about your job?", type: 'textarea', required: true },
        { key: 'custom_q3', label: "What\'s the worst part about your job?", type: 'textarea', required: true },
        { key: 'custom_q4', label: 'Do you need me to go on Amazon and buy you a webcam?', type: 'textarea', required: true },
        { key: 'custom_q5', label: 'Would you rather sleep in your warehouse for a whole week in order to get three days of PTO?', type: 'textarea', required: true }
      ]
    };

    Object.assign(QUESTION_SETS, DAILY_CUSTOM_QUESTION_SETS);

    let state = {
      stage: 'hero',
      name: '',
      reportDate: new Date().toISOString().split('T')[0],
      department: '',
      formData: {},
      isSubmitting: false,
      error: '',
      opsManagerExpanded: false
    };

    function triggerExplosion() {
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      const particles = [];
      const colors = ['#A3F3C5', '#0D2D53', '#EDEFED'];
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight * 0.5,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.5) * 15 - 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 6 + 2, life: 1
        });
      }
      const animate = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.012;
          if (p.life > 0) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        if (particles.some(p => p.life > 0)) requestAnimationFrame(animate);
        else document.body.removeChild(canvas);
      };
      animate();
    }

    function handleDepartmentSelect(dept) {
      state.department = dept;
      state.stage = 'questions';
      state.formData = {};
      render();
    }

    function toggleOpsManager() {
      state.opsManagerExpanded = !state.opsManagerExpanded;
      const expand = document.getElementById('ops-expand');
      const arrow  = document.getElementById('ops-arrow');
      if (expand) {
        expand.classList.toggle('open', state.opsManagerExpanded);
        if (arrow) arrow.style.transform = state.opsManagerExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
      }
    }

    function isFormValid() {
      const questions = QUESTION_SETS[state.department] || [];
      return questions.every(q => {
        if (!q.required) return true;
        if (q.showIf) {
          const conditionMet = state.formData[q.showIf.key] === q.showIf.value;
          if (!conditionMet) return true;
        }
        const value = state.formData[q.key];
        return value !== undefined && value !== '' && value !== null;
      });
    }

    async function handleSubmit() {
      state.isSubmitting = true;
      state.error = '';
      render();

      const submitData = {
        timestamp: new Date().toISOString(),
        name: state.name,
        report_date: state.reportDate,
        department: state.department,
        ...state.formData
      };

      try {
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKfBfPqTlsmKfbPzzzAg9eQZdkY_PhCmgiipwghHSffQ6PHzd8_rO2-b2A35LDzQ4/exec';
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(submitData)
        });
      } catch (err) {
        state.error = 'Failed to submit report. Please try again.';
        console.error(err);
        state.isSubmitting = false;
        render();
        return;
      }

      state.stage = 'success';
      triggerExplosion();
      render();
    }

    async function loadRecapData() {
      const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKfBfPqTlsmKfbPzzzAg9eQZdkY_PhCmgiipwghHSffQ6PHzd8_rO2-b2A35LDzQ4/exec';
      try {
        const [eodResponse, laborResponse] = await Promise.all([
          fetch(`${SCRIPT_URL}?date=${state.reportDate}`),
          fetch(`${SCRIPT_URL}?date=${state.reportDate}`)
        ]);
        const eodData = await eodResponse.json();
        const laborData = await laborResponse.json();
        const formattedDate = new Date(state.reportDate).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
        let recapText = `END OF DAY OPERATIONS REPORT\n${formattedDate}\n\nShowing latest submission from each team member\n\n`;
        if (laborData.success && laborData.data) {
          const labor = laborData.data;
          recapText += `DAILY LABOR SUMMARY\nHours: ${labor.total_hours.toFixed(2)} hrs | Orders: ${labor.orders_shipped} | Cost/Order: $${labor.cost_per_order.toFixed(2)}\n\n`;
        }
        if (eodData.success && eodData.reports && eodData.reports.length > 0) {
          const deptOrder = ['Outbound 1st','Inbound','Inventory','Outbound 2nd','Special Projects','Dedicated Inventory'];
          const byDept = {};
          eodData.reports.forEach(r => { if (!byDept[r.department]) byDept[r.department] = []; byDept[r.department].push(r); });
          deptOrder.forEach(dept => {
            if (byDept[dept]) {
              byDept[dept].forEach(report => {
                recapText += `${dept}\nSubmitted by ${report.name}\n`;
                if (report.headcount) recapText += `Headcount: ${report.headcount}`;
                if (report.orders_shipped) recapText += ` | Orders: ${report.orders_shipped}`;
                if (report.inbounds_today) recapText += ` | Inbounds: ${report.inbounds_today}`;
                recapText += `\n`;
                if (report.wins) recapText += `Wins:\n${report.wins}\n`;
                const issues = report.issues || report.dedicated_issues;
                recapText += `Issues:\n${issues || 'N/A'}\n\n`;
              });
            }
          });
        }
        document.getElementById('recap-content').innerText = recapText;
      } catch (error) {
        document.getElementById('recap-content').innerHTML = `<div class="text-red-400">Error loading recap data: ${error.message}</div>`;
      }
    }

    function copyRecap() {
      const recapContent = document.getElementById('recap-content').innerText;
      navigator.clipboard.writeText(recapContent).then(() => alert('✅ Recap copied to clipboard!')).catch(() => alert('Failed to copy.'));
    }

    function resetForm() {
      state = { stage: 'namedate', name: '', reportDate: new Date().toISOString().split('T')[0], department: '', formData: {}, isSubmitting: false, error: '', opsManagerExpanded: false };
      render();
    }

    function renderField(question) {
      if (question.showIf) {
        const conditionMet = state.formData[question.showIf.key] === question.showIf.value;
        if (!conditionMet) return '';
      }
      const value = state.formData[question.key] || '';
      const baseClass = "w-full bg-[#1a1d1e] border border-[#2a2d2e] rounded-xl px-5 py-4 text-[#EDEFED] input-focus transition-all";
      switch (question.type) {
        case 'number':  return `<input type="number" id="${question.key}" value="${value}" class="${baseClass}" ${question.required ? 'required' : ''}>`;
        case 'text':    return `<input type="text" id="${question.key}" value="${value}" class="${baseClass}" ${question.required ? 'required' : ''}>`;
        case 'textarea':return `<textarea id="${question.key}" rows="4" class="${baseClass} resize-none" ${question.required ? 'required' : ''}>${value}</textarea>`;
        case 'yesno':   return `
          <div class="flex gap-4">
            <button type="button" onclick="state.formData['${question.key}'] = 'yes'; render();" class="flex-1 py-4 rounded-xl border-2 transition-all font-medium ${value === 'yes' ? 'bg-[#A3F3C5] text-[#101314] border-[#A3F3C5] glow' : 'bg-transparent text-[#EDEFED] border-[#2a2d2e] hover:border-[#A3F3C5]'}">Yes</button>
            <button type="button" onclick="state.formData['${question.key}'] = 'no'; render();" class="flex-1 py-4 rounded-xl border-2 transition-all font-medium ${value === 'no' ? 'bg-[#A3F3C5] text-[#101314] border-[#A3F3C5] glow' : 'bg-transparent text-[#EDEFED] border-[#2a2d2e] hover:border-[#A3F3C5]'}">No</button>
          </div>`;
        default: return '';
      }
    }

    function setupInputListeners() {
      const questions = QUESTION_SETS[state.department] || [];
      questions.forEach(q => {
        const el = document.getElementById(q.key);
        if (el && q.type !== 'yesno') {
          el.addEventListener('input', (e) => {
            state.formData[q.key] = e.target.value;
            const btn = document.getElementById('submit-btn');
            if (btn) btn.disabled = !isFormValid();
          });
        }
      });
    }

    function render() {
      const app = document.getElementById('app');
      let content = '';

      if (state.stage === 'hero') {
        content = `
          <div class="min-h-screen gradient-bg grid-bg relative overflow-hidden">
            <div class="absolute top-20 left-10 w-72 h-72 bg-[#A3F3C5] opacity-10 rounded-full blur-3xl floating"></div>
            <div class="absolute bottom-20 right-10 w-96 h-96 bg-[#A3F3C5] opacity-10 rounded-full blur-3xl floating" style="animation-delay:-3s;"></div>
            <div class="relative z-10 flex items-center justify-center min-h-screen px-6">
              <div class="max-w-5xl w-full text-center fade-in-up">
                <div class="inline-block px-6 py-2 glass rounded-full text-[#A3F3C5] text-lg font-medium tracking-widest uppercase mb-8 glow">Operations Reporting Platform</div>
                <h1 class="text-7xl md:text-8xl lg:text-9xl font-extralight leading-none tracking-tight mb-8 bg-gradient-to-r from-white to-[#A3F3C5] bg-clip-text text-transparent">End of Day<br/>Reporting</h1>
                <p class="text-2xl text-[#9D9F9E] max-w-3xl mx-auto mb-12 font-light leading-relaxed">"When performance is measured, performance improves. When performance is measured and reported, the rate of improvement accelerates."</p>
                <button onclick="state.stage = 'namedate'; render();" class="group relative bg-[#A3F3C5] text-[#101314] px-12 py-5 rounded-2xl text-xl font-medium hover:bg-[#8de0ad] transition-all glow hover:scale-105 transform">
                  <span class="relative z-10">Start Your Report</span>
                </button>
              </div>
            </div>
          </div>`;

      } else if (state.stage === 'namedate') {
        content = `
          <div class="min-h-screen gradient-bg grid-bg flex items-center justify-center px-6 py-20">
            <div class="max-w-xl w-full">
              <div class="glass rounded-3xl p-10 scale-in glow">
                <h2 class="text-5xl font-light mb-12 text-center bg-gradient-to-r from-white to-[#A3F3C5] bg-clip-text text-transparent">Let's Begin</h2>
                <div class="space-y-8">
                  <div class="space-y-3">
                    <label class="block text-sm font-medium text-[#9D9F9E] uppercase tracking-wide">Your Name</label>
                    <input type="text" id="name-input" value="${state.name}" class="w-full bg-[#1a1d1e] border border-[#2a2d2e] rounded-xl px-5 py-4 text-[#EDEFED] text-lg input-focus transition-all" placeholder="Enter your name">
                  </div>
                  <div class="space-y-3">
                    <label class="block text-sm font-medium text-[#9D9F9E] uppercase tracking-wide">Report Date</label>
                    <input type="date" id="date-input" value="${state.reportDate}" class="w-full bg-[#1a1d1e] border border-[#2a2d2e] rounded-xl px-5 py-4 text-[#EDEFED] text-lg input-focus transition-all">
                  </div>
                  <button id="continue-btn" class="w-full bg-[#A3F3C5] text-[#101314] py-5 rounded-xl font-semibold text-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[#8de0ad] transition-all glow hover:scale-105 transform mt-10">Continue →</button>
                </div>
              </div>
            </div>
          </div>`;

      } else if (state.stage === 'department') {
        content = `
          <div class="min-h-screen gradient-bg grid-bg px-6 py-20">
            <div class="max-w-3xl mx-auto">
              <div class="text-center mb-16 fade-in-up">
                <h2 class="text-6xl font-light mb-4 bg-gradient-to-r from-white to-[#A3F3C5] bg-clip-text text-transparent">Select Department</h2>
                <p class="text-[#9D9F9E] text-lg">Choose your department to continue</p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 scale-in mb-8">

                <!-- OPS MANAGER DAILY REPORT — expandable card -->
                <div class="glass rounded-2xl overflow-hidden md:col-span-2 border border-[#A3F3C5]/30 glow">
                  <button onclick="toggleOpsManager()" class="w-full px-8 py-6 text-left flex items-center justify-between hover:bg-white/5 transition-all group">
                    <div>
                      <div class="text-xs font-medium tracking-widest uppercase text-[#A3F3C5] mb-1">Site Report</div>
                      <span class="text-xl font-light group-hover:text-[#A3F3C5] transition-colors">OPS Manager Daily Report</span>
                    </div>
                    <svg id="ops-arrow" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#A3F3C5] transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                  </button>
                  <div id="ops-expand" class="ops-expand">
                    <div class="px-8 pb-6 grid grid-cols-2 gap-4 border-t border-white/10 pt-5">
                      <a href="../../ops-manager-daily-report-mke.html"
                        class="flex items-center justify-center gap-3 py-4 rounded-xl font-medium tracking-wider uppercase text-sm transition-all hover:scale-[1.03] hover:bg-[#A3F3C5]/20"
                        style="background:rgba(163,243,197,0.1);border:1px solid rgba(163,243,197,0.3);color:#A3F3C5;">
                        <span>MKE — Ricardo</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                      </a>
                      <a href="../../ops-manager-daily-report-slc.html"
                        class="flex items-center justify-center gap-3 py-4 rounded-xl font-medium tracking-wider uppercase text-sm transition-all hover:scale-[1.03] hover:bg-[#A3F3C5]/20"
                        style="background:rgba(163,243,197,0.1);border:1px solid rgba(163,243,197,0.3);color:#A3F3C5;">
                        <span>SLC — Norman</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                      </a>
                    </div>
                  </div>
                </div>

                <!-- Regular department cards -->
                ${Object.keys(QUESTION_SETS).map((dept, i) => `
                  <button onclick="handleDepartmentSelect('${dept}')" class="glass rounded-2xl px-8 py-8 text-left hover:border-[#A3F3C5] hover:bg-[#1e2223] transition-all group transform hover:scale-105" style="animation-delay:${i * 0.1}s;">
                    <span class="text-xl font-light group-hover:text-[#A3F3C5] transition-colors block">${dept}</span>
                    <div class="mt-2 text-[#9D9F9E] text-sm opacity-0 group-hover:opacity-100 transition-opacity">Click to submit report →</div>
                  </button>
                `).join('')}
              </div>

              <div class="text-center mt-12">
                <button onclick="state.stage = 'recap'; render();" class="relative group inline-block w-64 h-64">
                  <div class="absolute top-1/2 left-1/2 w-full h-full -ml-32 -mt-32">
                    <div class="absolute inset-0 animate-orbit-1">
                      <div class="absolute top-1/2 left-1/2 w-56 h-20 -ml-28 -mt-10 border border-[#A3F3C5] rounded-full opacity-40" style="transform:rotateX(60deg);"></div>
                      <div class="absolute top-0 left-1/2 w-4 h-4 -ml-2 bg-[#A3F3C5] rounded-full shadow-[0_0_15px_#A3F3C5]"></div>
                    </div>
                    <div class="absolute inset-0 animate-orbit-2">
                      <div class="absolute top-1/2 left-1/2 w-56 h-20 -ml-28 -mt-10 border border-[#A3F3C5] rounded-full opacity-40" style="transform:rotateX(60deg) rotateZ(60deg);"></div>
                      <div class="absolute top-0 left-1/2 w-4 h-4 -ml-2 bg-[#A3F3C5] rounded-full shadow-[0_0_15px_#A3F3C5]"></div>
                    </div>
                    <div class="absolute inset-0 animate-orbit-3">
                      <div class="absolute top-1/2 left-1/2 w-56 h-20 -ml-28 -mt-10 border border-[#A3F3C5] rounded-full opacity-40" style="transform:rotateX(60deg) rotateZ(120deg);"></div>
                      <div class="absolute top-0 left-1/2 w-4 h-4 -ml-2 bg-[#A3F3C5] rounded-full shadow-[0_0_15px_#A3F3C5]"></div>
                    </div>
                  </div>
                  <div class="absolute top-1/2 left-1/2 -ml-16 -mt-16 z-20">
                    <div class="absolute inset-0 bg-[#A3F3C5] rounded-full blur-2xl opacity-60 animate-pulse"></div>
                    <div class="relative w-32 h-32 rounded-full bg-gradient-to-br from-[#A3F3C5] to-[#0D2D53] border-2 border-[#A3F3C5] shadow-[0_0_60px_rgba(163,243,197,0.8)] flex items-center justify-center transform transition-all duration-500 group-hover:scale-125 group-hover:shadow-[0_0_100px_rgba(163,243,197,1)]">
                      <div class="absolute inset-2 rounded-full bg-gradient-to-br from-[#0D2D53] to-[#1a4d7a]"></div>
                      <span class="relative z-10 text-2xl font-black tracking-wider text-[#A3F3C5] drop-shadow-[0_0_10px_rgba(163,243,197,1)]">RECAP</span>
                    </div>
                  </div>
                </button>
              </div>

              <style>
                @keyframes orbit-1 { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
                @keyframes orbit-2 { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
                @keyframes orbit-3 { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
                .animate-orbit-1 { animation: orbit-1 6s linear infinite; }
                .animate-orbit-2 { animation: orbit-2 8s linear infinite; }
                .animate-orbit-3 { animation: orbit-3 10s linear infinite; }
              </style>
            </div>
          </div>`;

      } else if (state.stage === 'recap') {
        content = `
          <div class="min-h-screen gradient-bg grid-bg px-6 py-20">
            <div class="max-w-5xl mx-auto">
              <div class="text-center mb-12 fade-in-up">
                <h2 class="text-6xl font-light mb-4 bg-gradient-to-r from-white to-[#A3F3C5] bg-clip-text text-transparent">Executive Recap</h2>
                <p class="text-[#9D9F9E] text-lg">${new Date(state.reportDate).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' })}</p>
              </div>
              <div class="glass rounded-3xl p-10 scale-in mb-8">
                <div class="flex justify-between items-center mb-6">
                  <h3 class="text-3xl font-light text-[#A3F3C5]">Operations Summary</h3>
                  <button onclick="copyRecap()" class="bg-[#A3F3C5] text-[#101314] px-6 py-3 rounded-xl font-semibold hover:bg-[#8de0ad] transition-all glow">📋 Copy to Clipboard</button>
                </div>
                <div id="recap-content" class="space-y-6 text-[#EDEFED] font-mono text-sm bg-[#0a0b0c] p-6 rounded-xl border border-[#2a2d2e] whitespace-pre-wrap">Loading data from sheets...</div>
                <div class="mt-8 text-center">
                  <button onclick="state.stage = 'department'; render();" class="text-[#9D9F9E] hover:text-[#A3F3C5] transition-colors">← Back to Reports</button>
                </div>
              </div>
            </div>
          </div>`;

      } else if (state.stage === 'questions') {
        const questions = QUESTION_SETS[state.department] || [];
        content = `
          <div class="min-h-screen gradient-bg grid-bg px-6 py-20">
            <div class="max-w-4xl mx-auto">
              <div class="flex items-center justify-between mb-16 fade-in-up">
                <div>
                  <div class="inline-block px-4 py-1 glass rounded-full text-[#A3F3C5] text-xs font-medium tracking-wider uppercase mb-3">${state.department}</div>
                  <h2 class="text-5xl font-light bg-gradient-to-r from-white to-[#A3F3C5] bg-clip-text text-transparent">Daily Report</h2>
                </div>
                <button onclick="state.stage = 'department'; render();" class="text-[#9D9F9E] hover:text-[#A3F3C5] text-sm transition-colors px-4 py-2 glass rounded-lg">← Change Department</button>
              </div>
              <div class="glass rounded-3xl p-10 scale-in">
                <div class="space-y-8">
                  ${questions.map(q => `
                    <div class="space-y-3">
                      <label class="block text-sm font-medium text-[#9D9F9E] uppercase tracking-wide">
                        ${q.label}${q.required ? '<span class="text-[#A3F3C5] ml-1">*</span>' : ''}
                      </label>
                      ${renderField(q)}
                    </div>`).join('')}
                  ${state.error ? `<div class="bg-red-900/20 border border-red-500 text-red-400 px-5 py-4 rounded-xl">${state.error}</div>` : ''}
                  <button id="submit-btn" onclick="handleSubmit()" class="w-full bg-[#A3F3C5] text-[#101314] py-5 rounded-xl font-semibold text-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[#8de0ad] transition-all glow hover:scale-105 transform mt-10">
                    ${state.isSubmitting ? 'Submitting...' : 'Submit Report'}
                  </button>
                </div>
              </div>
            </div>
          </div>`;

      } else if (state.stage === 'success') {
        content = `
          <div class="min-h-screen gradient-bg grid-bg flex items-center justify-center px-6">
            <div class="max-w-2xl w-full text-center scale-in">
              <div class="glass rounded-3xl p-16 glow">
                <div class="w-28 h-28 bg-[#A3F3C5] rounded-full mx-auto flex items-center justify-center mb-8 glow">
                  <svg class="w-14 h-14 text-[#101314]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                  </svg>
                </div>
                <h2 class="text-5xl font-light mb-6 bg-gradient-to-r from-white to-[#A3F3C5] bg-clip-text text-transparent">Report Submitted!</h2>
                <p class="text-[#9D9F9E] text-xl mb-4 font-light">Your ${state.department} report for ${new Date(state.reportDate).toLocaleDateString()} has been submitted successfully.</p>
                <p class="text-[#9D9F9E] text-sm mb-12">Thank you for keeping operations running smoothly.</p>
                <button onclick="resetForm()" class="bg-[#A3F3C5] text-[#101314] px-10 py-4 rounded-xl font-semibold hover:bg-[#8de0ad] transition-all glow hover:scale-105 transform">Submit Another Report</button>
              </div>
            </div>
          </div>`;
      }

      app.innerHTML = content;

      if (state.stage === 'recap') setTimeout(async () => { await loadRecapData(); }, 100);

      if (state.stage === 'namedate') {
        const nameInput = document.getElementById('name-input');
        const dateInput = document.getElementById('date-input');
        const continueBtn = document.getElementById('continue-btn');
        nameInput.addEventListener('input', (e) => { state.name = e.target.value; continueBtn.disabled = !state.name || !state.reportDate; });
        dateInput.addEventListener('input', (e) => { state.reportDate = e.target.value; continueBtn.disabled = !state.name || !state.reportDate; });
        continueBtn.addEventListener('click', () => { state.stage = 'department'; render(); });
        continueBtn.disabled = !state.name || !state.reportDate;
      }

      if (state.stage === 'questions') {
        setupInputListeners();
        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn) submitBtn.disabled = !isFormValid() || state.isSubmitting;
      }

      // Restore expand state after re-render
      if (state.stage === 'department' && state.opsManagerExpanded) {
        const expand = document.getElementById('ops-expand');
        const arrow  = document.getElementById('ops-arrow');
        if (expand) { expand.classList.add('open'); }
        if (arrow)  { arrow.style.transform = 'rotate(180deg)'; }
      }
    }

    render();
  </script>
</body>
</html>
